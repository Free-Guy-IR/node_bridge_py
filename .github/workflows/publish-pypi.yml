name: Publish Python Package to PyPI
on:
    release:
        types: [published]
permissions:
  contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Build package
              run: uv build

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

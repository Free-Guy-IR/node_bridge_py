name: Upstream parity

on:
    push:
    pull_request:
    schedule:
        - cron: "17 4 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: upstream-parity-${{ github.ref }}
    cancel-in-progress: true

jobs:
    parity:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Test the parity checker
              run: python -W error::ResourceWarning -m unittest tests.test_upstream_parity -v
            - name: Every upstream release commit is ported, version-only, waived, or deferred within its date
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: python scripts/check_upstream_parity.py

divergence = "a01bdbb and the fork both keep each rejected user's backoff in an in-memory per-node map, and a store with request_refresh (on the fork, one without both hold_users and retire_held) is acked and asked to refresh the user when due on both (upstream behaviour). The fork diverges for the other stores: when due, a01bdbb queues the held payload again (enqueue_users_if_absent or enqueue_users), while the fork never queues a held payload under a new revision. A store with hold_users and retire_held keeps the claimed entry queued at its revision, unclaimable until due, and a snapshot retires it (6322313; 9e6cd12 through b67402c fix its due, snapshot, fence and batching paths); any other store keeps the claim leased for the backoff or one lease, whichever ends first (README store contract). 448eb04 keeps a held retry from replacing a newer change another worker queued or delivered, and 013202e keeps a retry superseded while it was re-queued from failing the round. The fork also keeps isolation progress across rounds on slow nodes (5bba048) and hard-resets a node that rejects every user (d886f42, 3eee262), which upstream does not. dd7906a and 8d863e3 rewrite the README store contract and round-failure text to match"

